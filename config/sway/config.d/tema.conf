# Ajustes visuais do sway (cursor, island, bordas, avisos, energia, temas).
# Carregado depois de /etc/sway/config.d/, então sobrescreve o tema do openSUSE.

# Cores das bordas e wallpaper: config.d/cores.conf, gerado por ~/.config/temas/tema.
# Wallpaper do tema Espacial: Penhascos Cósmicos, Nebulosa de Carina
# (ESA/Webb, NASA, ESA, CSA, STScI, CC BY 4.0)

# Cursor um pouco maior (padrão 24). O gsettings vale para apps GTK.
seat * xcursor_theme Adwaita 28
exec_always gsettings set org.gnome.desktop.interface cursor-size 28

# Dynamic island no centro do topo (~/.config/eww/)
exec eww open-many ilha boas-vindas

default_border pixel 2
default_floating_border pixel 2
gaps inner 10


# Avisos rápidos na island (substituem a barrinha do wob)
set $aviso ~/.config/eww/scripts/aviso.sh
unbindsym XF86AudioRaiseVolume
unbindsym XF86AudioLowerVolume
unbindsym XF86AudioMute
unbindsym XF86MonBrightnessUp
unbindsym XF86MonBrightnessDown
bindsym XF86AudioRaiseVolume exec $aviso volume-mais
bindsym XF86AudioLowerVolume exec $aviso volume-menos
bindsym XF86AudioMute exec $aviso mudo
bindsym XF86MonBrightnessUp exec $aviso brilho-mais
bindsym XF86MonBrightnessDown exec $aviso brilho-menos

# Tela de energia (eww), no lugar do menu de texto do openSUSE
set $energia ~/.config/eww/scripts/energia.sh
unbindsym $mod+Shift+e
bindsym $mod+Shift+e exec $energia abrir
mode "energia" {
    bindsym b exec $energia bloquear
    bindsym s exec $energia suspender
    bindsym e exec $energia sair
    bindsym r exec $energia reiniciar
    bindsym d exec $energia desligar
    bindsym Escape exec $energia fechar
}

# Seletor de temas (eww): Win+Shift+T, Esc fecha
set $temas ~/.config/eww/scripts/temas.sh
bindsym $mod+Shift+t exec $temas abrir
mode "temas" {
    bindsym Escape exec $temas fechar
}
